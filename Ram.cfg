//Windows mouse: 6/11, EPP off, 400dpi, 4x3

//Sensitivity
sensitivity 1.8
zoom_sensitivity_ratio 1

//Viewmodel Commands:
viewmodel_presetpos 0
viewmodel_offset_x 2.5
viewmodel_offset_y 2
viewmodel_offset_z -2
viewmodel_fov 68
cl_prefer_lefthanded 0

//CROSSHAIR COMMANDS
cl_crosshairstyle 5
cl_crosshairsize 3.5
cl_crosshairthickness 0.5
cl_crosshairgap -1
cl_crosshair_drawoutline 0
cl_crosshairdot 1
cl_crosshair_t 0
cl_crosshairusealpha 1
cl_crosshairalpha 255
cl_crosshair_recoil 0
cl_crosshairgap_useweaponvalue 0
cl_crosshaircolor_r 255
cl_crosshaircolor_g 0
cl_crosshaircolor_b 0
 
//EXTRAS
cl_crosshair_sniper_width 2
cl_crosshair_friendly_warning 1
hud_showtargetid 1
cl_hud_color 6

//Radar
cl_radar_always_centered false
cl_radar_rotate true
cl_radar_scale 0.35
cl_radar_icon_scale_min 0.5

//Audio
snd_menumusic_volume 0.01
snd_roundstart_volume 0.01
snd_roundaction_volume 0.0
snd_roundend_volume 0.01
snd_mvp_volume 0.02
snd_mapobjective_volume 0.02
snd_tensecondwarning_volume 0.04
snd_deathcamera_volume 0.04
snd_mute_mvp_music_live_players true

//Keybinds
bind mwheelup +jump
bind mwheeldown +jump
bind scancode44 +jump //SPACE
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind scancode224 "+duck" //CTRL
bind scancode8 "+use" //e
bind scancode20 "lastinv" //q
bind scancode10 "drop" //g
bind "MOUSE4" "+voicerecord"
bind scancode30 "slot1" //1
bind scancode31 "slot2" //2
bind scancode32 "slot3" //3
bind scancode34 "slot5" //5
bind scancode29 "radio" //z
bind scancode27 "radio1" //x
bind scancode9 "+lookatweapon" //f
bind scancode5 "buymenu" //b
bind scancode26 "+forward" //w
bind scancode22 "+back" //s
bind scancode4 "+left" //a
bind scancode7 "+right" //d
bind scancode58 "slot6" //F1
bind scancode59 "slot7" //F2
bind scancode60 "slot8" //F3
bind scancode61 "slot10" //F4
bind scancode62 "vote_yes" //F5
bind scancode63 "vote_no" //F6
bind scancode225 "+sprint" //SHIFT
bind scancode25 "player_ping" //v
bind scancode23 "+spray_menu" //t
bind "MOUSE5" "+cl_show_team_equipment"
bind scancode43 "+showscores" //TAB
bind scancode6 "slot12" //c
bind scancode13 "+radialradio" //j
bind scancode14 "+radialradio2" //k

cl_sniper_auto_rezoom true
cl_sniper_show_inaccuracy false
cl_sniper_delay_unscope false

hud_scaling 1
cl_use_opens_buy_menu false
fps_max 0

